name: Legacy 2.1 Candidate CI
on:
  push:
    branches: [audit/legacy-2.1.7-20261029]
  pull_request:
    branches: [audit/legacy-2.1.6-recovered-20261029]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand --detectOpenHandles
      - run: node --test tests/*.test.cjs
      - run: npm audit --omit=dev
      - name: Reject stale build outputs
        run: node tests/build-clean.cjs
      - name: Pack reviewed legacy identity without publishing
        run: node tests/pack-receipt.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: legacy-candidate-${{ matrix.node-version }}
          path: release/
          if-no-files-found: error
