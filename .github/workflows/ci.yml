name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Release policy regression tests
        run: node scripts/release-guard.test.cjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
      - name: Original matcher, callback and mock assertion inventory
        run: npm run test:port
      - name: Production and full development dependency advisories
        run: |
          npm audit --omit=dev
          npm audit
      - name: Build clean runtime and portable matcher regression
        run: |
          npm run build
          npm run test:matcher
      - name: Clean tarball API, privacy, collector and lifecycle consumers
        run: npm run test:consumer

  minimum-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0
      - name: Actual minimum production artifact, not the development toolchain floor
        run: |
          node scripts/test.cjs
          node scripts/test-inventory.cjs
          node --test scripts/matcher-security.test.cjs scripts/matcher-contracts.test.cjs
          node scripts/qualify-consumer.cjs
